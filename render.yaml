# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard: New > Blueprint > pick this repo. You'll be asked for the
# `sync: false` values (secrets) on first deploy.
services:
  - type: web
    name: promptcode
    runtime: docker
    plan: free            # free instances sleep when idle; use "starter" to keep the daily scheduler awake
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: KEY_ENCRYPTION_SECRET   # encrypts users' own API keys; never change it after launch
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: promptcode-db
          property: connectionString
      - key: RATE_LIMIT_STORAGE
        fromService:
          type: keyvalue
          name: promptcode-redis
          property: connectionString
      # ---- secrets / per-deployment values (entered in the dashboard) ----
      - key: APP_URL              # e.g. https://promptcode.onrender.com (no trailing slash)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY         # free backup models (console.groq.com); optional
        sync: false
      - key: MODEL_LIMITS         # optional pacing overrides, e.g. gemini-3.5-flash-lite=15:0:1000
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM           # e.g. PromptCode <no-reply@yourdomain.com> (domain verified in Resend)
        sync: false
      - key: CONTACT_EMAIL        # shown on /privacy and /terms for data requests
        sync: false
      - key: SENTRY_DSN           # optional
        sync: false
      - key: REMINDER_DAILY_CAP   # optional; streak reminder emails per day (default 90)
        sync: false
      - key: DAILY_TOKEN_CAP      # optional site-wide daily Gemini token cap, e.g. 2000000
        sync: false

  - type: keyvalue
    name: promptcode-redis
    plan: free
    ipAllowList: []       # only reachable from your Render services

databases:
  - name: promptcode-db
    plan: free            # note: Render's free Postgres expires after 30 days - upgrade to keep data
    databaseName: promptcode
    user: promptcode

# Streak reminder emails on the free plan: the web service sleeps when idle, so add a Cron Job
# (a paid Render feature) that runs `python -m app.reminders` at 18:00 UTC with the same
# environment variables as the web service. Uncomment and fill in to use it:
#
#   - type: cron
#     name: promptcode-reminders
#     runtime: docker
#     schedule: "0 18 * * *"
#     dockerCommand: python -m app.reminders
#     envVars: [ ...same as the web service... ]
